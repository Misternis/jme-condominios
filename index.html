<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8"/>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>JME Gestão de Condomínios – Em desenvolvimento</title>

<style>

  :root {

    --blue:   #1a6e8e;

    --blue2:  #0d4f6a;

    --green:  #7dc242;

    --green2: #5a9e2f;

    --light:  #f4faff;

    --gray:   #5a6a75;

    --white:  #ffffff;

  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{font-family:'Segoe UI',Arial,sans-serif;color:#222;background:#fff;min-height:100vh;display:flex;flex-direction:column;}



  /* ── NAV ── */

  nav{

    position:sticky;top:0;z-index:100;

    background:var(--blue2);

    display:flex;align-items:center;justify-content:space-between;

    padding:14px 40px;box-shadow:0 2px 12px rgba(0,0,0,.25);

  }

  .nav-brand{color:#fff;font-size:1.4rem;font-weight:800;letter-spacing:1px;}

  .nav-brand span{color:var(--green);}



  /* ── LANDING EM DESENVOLVIMENTO ── */

  main{flex:1;display:flex;align-items:center;justify-content:center;}

  .hero-dev{

    background:linear-gradient(135deg,var(--blue2) 0%,var(--blue) 60%,var(--green2) 100%);

    color:#fff;text-align:center;padding:90px 24px 80px;

    width:100%;position:relative;overflow:hidden;

  }

  .hero-dev::before{

    content:'';position:absolute;inset:0;

    background:url('https://images.unsplash.com/photo-1486325212027-8081e485255e?w=1400&q=60') center/cover no-repeat;

    opacity:.12;

  }

  .hero-dev-inner{position:relative;z-index:1;max-width:560px;margin:0 auto;}

  .hero-dev .badge{

    display:inline-block;background:var(--green);color:#fff;

    font-size:.8rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;

    padding:6px 18px;border-radius:20px;margin-bottom:20px;

  }

  .hero-dev h1{font-size:2.4rem;font-weight:900;line-height:1.2;margin-bottom:16px;text-shadow:0 2px 8px rgba(0,0,0,.3);}

  .hero-dev h1 span{color:var(--green);}

  .hero-dev p{font-size:1.1rem;opacity:.92;line-height:1.65;}



  /* ── FOOTER ── */

  footer{background:var(--blue2);color:#acd4e8;text-align:center;padding:28px 20px;font-size:.88rem;}

  footer strong{color:var(--green);}



  @media(max-width:650px){

    .hero-dev h1{font-size:1.85rem;}

    nav{padding:14px 20px;}

  }

</style>

</head>

<body>



<nav>

  <div class="nav-brand">JME <span>Gestão de Condomínios</span></div>

</nav>



<main>

  <section class="hero-dev" aria-label="Status do site">

    <div class="hero-dev-inner">

      <div class="badge">Site em construção</div>

      <h1>Em <span>desenvolvimento</span></h1>

      <p>Estamos preparando o novo site da JME Gestão de Condomínios. Em breve você poderá conhecer nossos serviços e entrar em contato por aqui.</p>

    </div>

  </section>

</main>



<footer>

  <p>© 2025 <strong>JME Gestão de Condomínios</strong> — Todos os direitos reservados.</p>

  

</footer>



</body>

</html>
